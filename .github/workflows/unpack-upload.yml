name: Final PyQuest import

on:
  push:
    paths:
      - ".github/workflows/unpack-upload.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore uploaded project
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/payload.b64 <<'PAYLOAD'
          
          PAYLOAD
          base64 -d /tmp/payload.b64 > /tmp/payload.tar.xz
          echo "454c22dfda5d00ec778123e5873dc8d1f6048cec72313de6ee86d01decfd1b32  /tmp/payload.tar.xz" | sha256sum -c -
          xz -t /tmp/payload.tar.xz
          mkdir -p /tmp/unpack
          tar -xJf /tmp/payload.tar.xz -C /tmp/unpack
          test -d /tmp/unpack/PyQuest-main
          rsync -a --delete --exclude='.git/' /tmp/unpack/PyQuest-main/ ./

      - name: Commit real project files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import real PyQuest project files"
          git push
