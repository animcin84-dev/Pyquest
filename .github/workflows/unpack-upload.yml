name: Import real PyQuest project

on:
  push:
    paths:
      - ".github/workflows/unpack-upload.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild verified archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .tmp_import/part00 \
            .tmp_import/part01 \
            .tmp_import/part02 \
            .tmp_import/part03 \
            .tmp_import/part04 \
            .tmp_import/part05 \
            .tmp_import/part06 \
            .tmp_import/part07 \
            .tmp_import/f080_0 \
            .tmp_import/f080_1 \
            .tmp_import/f081_0 \
            .tmp_import/f081_1 \
            .tmp_import/f090_0 \
            .tmp_import/f090_1 \
            .tmp_import/f091_0 \
            .tmp_import/f091_1 \
            .tmp_import/part10 \
            .tmp_import/part11 \
            .tmp_import/part12 \
            .tmp_import/part13 \
            .tmp_import/part14 \
            .tmp_import/part15 \
            .tmp_import/part16 \
            .tmp_import/part17 \
            > /tmp/payload.b64
          base64 -d /tmp/payload.b64 > /tmp/payload.tar.xz
          echo "fa097c7de5f3923d373f6d176c7b56707cd4fe1d42a6f24c3dccfcf8cd650654  /tmp/payload.tar.xz" | sha256sum -c -
          xz -t /tmp/payload.tar.xz
          tar -tJf /tmp/payload.tar.xz >/dev/null

      - name: Replace repository with project files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/unpack
          tar -xJf /tmp/payload.tar.xz -C /tmp/unpack
          test -d /tmp/unpack/PyQuest-main
          test -d /tmp/unpack/PyQuest-main/src
          test -f /tmp/unpack/PyQuest-main/package.json
          rsync -a --delete --exclude='.git/' /tmp/unpack/PyQuest-main/ ./

      - name: Commit real project tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import real PyQuest project files"
          git push
